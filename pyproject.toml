[project]
name = "tokenweir"
version = "0.1.0"
description = "A budget-aware, test-driven coding agent orchestration tool"
readme = "README.md"
authors = [
    { name = "rooneyouma", email = "oumarooney47@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.109.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tokenweir = "tokenweir.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
